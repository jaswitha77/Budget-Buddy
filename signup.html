
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Join Budget Buddy</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="purple-page">

    <main class="auth-page">

        <!-- Left Welcome Section -->

        <section class="auth-welcome">

            <div class="auth-brand">
                👛 Budget <strong>Buddy</strong>
            </div>

            <div class="auth-decoration">
                💜
            </div>

            <h1>
                Start your<br>
                <span>money journey.</span>
            </h1>

            <p>
                Create your Budget Buddy account and
                take the first step towards smarter
                spending and better saving.
            </p>

            <div class="auth-points">

                <div>
                    ✨ Track your spending
                </div>

                <div>
                    🎯 Set your goals
                </div>

                <div>
                    💰 Stay on budget
                </div>

            </div>

        </section>


        <!-- Signup Form -->

        <section class="auth-card">

            <div class="auth-icon">
                ✨
            </div>

            <h2>Create Account</h2>

            <p class="auth-subtitle">
                Your smarter financial journey starts here.
            </p>


            <form id="signupForm">

                <label for="signupName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >


                <label for="signupEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >


                <button type="submit" class="auth-button">
                    Create My Account →
                </button>

            </form>


            <p id="signupMessage"
               class="message">
            </p>


            <p class="switch-auth">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
